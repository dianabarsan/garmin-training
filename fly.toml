# fly.toml app configuration file generated for garmin-mcp-twisteddiana on 2026-11-17T09:57:40+02:00
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'garmin-mcp-twisteddiana'
primary_region = 'ams'

[experimental]
  cmd = ['-addr', ':8808']

[build]
  dockerfile = 'deploy/Dockerfile'

[env]
  GARMIN_MCP_DISABLE_AUTH_ENDPOINT = 'true'

[http_service]
  internal_port = 8808
  force_https = true
  # Suspend when idle and wake on the next request. A suspended machine resumes from a
  # memory snapshot, so MCP sessions and the cached Garmin token survive the pause.
  # min_machines_running must be 0, or the proxy never suspends the only machine.
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
